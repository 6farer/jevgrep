[package]
name = "jevgrep"
version = "0.2.0"
edition = "2021"
description = "grep where the pattern is a sentence: filters files, directories and live streams with the TypeSafe jev decision model"
license = "MIT"
readme = "README.md"
repository = "https://github.com/6farer/jevgrep"
keywords = ["grep", "logs", "tail", "cli", "typesafe"]
categories = ["command-line-utilities"]

[[bin]]
name = "jevgrep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
ignore = "0.4"
globset = "0.4"
toml = "0.8"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
